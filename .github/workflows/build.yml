name: Build apps

permissions:
  contents: read  # build jobs only read; the release job below gets write

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller delocate
      - run: pytest -q
      # universal2 (Intel + Apple silicon) needs fat native modules: PyPI has universal2
      # wheels for cryptography up to 48.x only, and thin ones for cffi, which are merged.
      - name: Universal2 cryptography and cffi
        run: |
          set -e
          CFFI=$(python -c "import importlib.metadata as m; print(m.version('cffi'))")
          for plat in macosx_11_0_arm64 macosx_10_15_x86_64; do
            pip download --only-binary=:all: --no-deps --python-version 3.12 \
              --platform $plat "cffi==$CFFI" -d thin
          done
          delocate-merge thin/cffi-*.whl -w uwheels
          pip download --only-binary=:all: --no-deps --python-version 3.12 \
            --platform macosx_10_9_universal2 "cryptography<49" -d uwheels
          pip install --force-reinstall --no-deps uwheels/*.whl
          for mod in _cffi_backend cryptography.hazmat.bindings._rust; do
            lipo "$(python -c "import $mod as m; print(m.__file__)")" -verify_arch x86_64 arm64
          done
      - run: >
          pyinstaller --clean --windowed --noconfirm --target-arch universal2
          --name "PsySet" --icon assets/psyset.icns
          --add-data "assets:assets"
          PsySet.py
      - name: cryptography is bundled
        run: >
          find dist/PsySet.app -path '*cryptography*' -name '*.so' | grep -q .
          || { echo "cryptography not bundled"; exit 1; }
      - run: >
          plutil -replace NSAppleEventsUsageDescription -string
          "PsySet utilise Word pour convertir vos documents en PDF. / PsySet uses Word to convert your documents to PDF."
          dist/PsySet.app/Contents/Info.plist
      - run: codesign --force --deep -s - dist/PsySet.app
      - run: ditto -c -k --keepParent "dist/PsySet.app" "PsySet-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PsySet-macOS
          path: PsySet-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller
      - run: pytest -q
      - run: >
          pyinstaller --windowed --onefile --noconfirm
          --name "PsySet" --icon assets/psyset.ico
          --add-data "assets;assets"
          PsySet.py
      - run: Compress-Archive -Path "dist/PsySet.exe" -DestinationPath "PsySet-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PsySet-Windows
          path: PsySet-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            PsySet-macOS.zip
            PsySet-Windows.zip
